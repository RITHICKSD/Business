<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Login | Nexelra Consulting</title>
    <meta name="description" content="Secure login portal for Nexelra Consulting clients and administrators." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>

<body class="auth-page">

    <div class="auth-controls">
        <button class="theme-toggle" id="themeBtn" title="Toggle Light/Dark" aria-label="Toggle color theme">
            <i class="fa-solid fa-moon"></i>
            <i class="fa-solid fa-sun"></i>
        </button>
        <button class="auth-globe" id="globeBtn" title="Toggle LTR / RTL">
            <span>LTR</span>
        </button>
    </div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="nav-logo"
                    style="text-decoration: none; justify-content: center; margin-bottom: 24px;">
                    <div class="logo-mark">
                        <svg width="40" height="40" viewBox="0 0 36 36" fill="none">
                            <polygon points="18,2 34,10 34,26 18,34 2,26 2,10" fill="none" stroke="url(#gGoldAuth)"
                                stroke-width="1.5" />
                            <polygon points="18,7 29,13 29,23 18,29 7,23 7,13" fill="url(#gGoldFillAuth)"
                                opacity="0.15" />
                            <text x="18" y="22" text-anchor="middle" fill="url(#gGoldAuth)" font-size="11"
                                font-family="Cormorant Garamond" font-weight="700" letter-spacing="1">NX</text>
                            <defs>
                                <linearGradient id="gGoldAuth" x1="0" y1="0" x2="36" y2="36"
                                    gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#D4AF37" />
                                    <stop offset="50%" stop-color="#F5D16A" />
                                    <stop offset="100%" stop-color="#B8960C" />
                                </linearGradient>
                                <linearGradient id="gGoldFillAuth" x1="0" y1="0" x2="36" y2="36"
                                    gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#D4AF37" />
                                    <stop offset="100%" stop-color="#F5D16A" />
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <div class="logo-text">
                        <span class="logo-brand" style="font-size: 1.3rem;">NEXELRA</span>
                        <span class="logo-tagline">CONSULTING</span>
                    </div>
                </a>
                <h2 class="auth-title">Welcome back! Please login to your account</h2>
            </div>

            <form class="auth-form" action="user-dashboard.html">
                <div class="form-group auth-group">
                    <label>Email Address</label>
                    <input type="email" class="form-control" placeholder="admin@nexelra.com" required>
                </div>
                <div class="form-group auth-group">
                    <label>Password</label>
                    <input type="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <div class="auth-actions">
                    <a href="#" class="forgot-pwd">?Forgot password</a>
                    <!-- Using RTL switch the order will naturally flip -->
                    <label class="remember-me">
                        <span>Remember me</span>
                        <input type="checkbox">
                    </label>
                </div>

                <button type="submit" class="btn btn-gold w-100 mt-4">LOGIN</button>

                <div class="auth-divider">
                    <span>OR</span>
                </div>

                <button type="button" class="btn btn-social">
                    <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4" />
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853" />
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                            fill="#FBBC05" />
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335" />
                    </svg> Continue with Google
                </button>
                <button type="button" class="btn btn-social">
                    <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
                            fill="#1877F2" />
                        <path
                            d="M16.671 15.542l.532-3.469h-3.328v-2.25c0-.949.465-1.874 1.956-1.874h1.539v-2.953s-1.374-.235-2.686-.235c-2.741 0-4.533 1.662-4.533 4.669v3.043H7.078v3.469h3.047v8.385a12.09 12.09 0 003.75 0v-8.385h2.796z"
                            fill="#fff" />
                    </svg> Continue with Facebook
                </button>

                <p class="auth-footer-text">
                    Don't have an account? <a href="register.html">Register here</a>
                </p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
